<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk HTML 파싱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/html-parse.js"></script>
  </head>
  <body data-page="html-parse">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>HTML 파싱</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link" href="/download">데이터 구축</a>
          <a class="nav-link active" href="/html-download">원문 처리</a>
        </nav>
      </header>

      <main class="download-view">
        <nav class="workflow-tabs panel" aria-label="원문 처리 세부 페이지">
          <a class="workflow-tab" href="/html-download">
            <span class="workflow-step">4</span>
            <span>HTML 저장</span>
          </a>
          <a class="workflow-tab active" href="/html-parse">
            <span class="workflow-step">5</span>
            <span>HTML 파싱</span>
          </a>
          <a class="workflow-tab" href="/html-bond-summary">
            <span class="workflow-step">6</span>
            <span>사채 발행 요약</span>
          </a>
        </nav>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Source</div>
              <div class="panel-title">로컬 HTML 폴더</div>
            </div>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>입력 경로</span>
              <div class="path-input-row">
                <input id="inputDirectory" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="inputDirectory"
                  data-dialog-mode="folder"
                  data-dialog-title="HTML 폴더 선택"
                >
                  📁
                </button>
              </div>
            </label>
            <label class="field">
              <span>결과 경로</span>
              <div class="path-input-row">
                <input id="outputPath" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="outputPath"
                  data-dialog-mode="save"
                  data-dialog-title="파싱 결과 JSON 선택"
                >
                  📁
                </button>
              </div>
            </label>
          </div>
          <div class="download-grid download-grid-3">
            <label class="field">
              <span>파싱 모드</span>
              <select id="parseMode"></select>
            </label>
            <label class="field">
              <span>최대 처리 건수</span>
              <input id="limit" type="number" min="1" max="10000" step="1" placeholder="비우면 전체" />
            </label>
            <label class="field">
              <span>오류 처리</span>
              <span class="checkbox-card">
                <input id="skipErrors" type="checkbox" checked />
                실패 파일 건너뛰기
              </span>
            </label>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>이어하기</span>
              <span class="checkbox-card">
                <input id="resumeParse" type="checkbox" checked />
                기존 결과 JSON 이후부터 진행
              </span>
            </label>
            <label class="field">
              <span>진행 확인 간격(N건)</span>
              <input id="progressInterval" type="number" min="1" max="10000" step="1" value="10" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Modes</div>
              <div class="panel-title">모드별 기능</div>
            </div>
          </div>
          <div id="modeCards" class="mode-cards"></div>
        </section>

        <section class="panel download-panel">
          <div class="download-actions">
            <button id="parseBtn" class="action-button action-button-primary action-button-compact" type="button">
              HTML 파싱 실행
            </button>
            <button id="cancelParseBtn" class="action-button action-button-muted action-button-compact" type="button" disabled>
              중지
            </button>
          </div>
          <div id="status" class="download-status"></div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Result</div>
              <div class="panel-title">파싱 결과</div>
            </div>
          </div>
          <pre id="result" class="download-result">결과 없음</pre>
        </section>

      </main>
    </div>
  </body>
</html>
