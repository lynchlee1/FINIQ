<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk 공시 필터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/filter.js"></script>
  </head>
  <body data-page="filter">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>공시 필터</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link active" href="/download">데이터 구축</a>
          <a class="nav-link" href="/html-download">원문 처리</a>
        </nav>
      </header>

      <main class="download-view">
        <nav class="workflow-tabs panel" aria-label="데이터 구축 세부 페이지">
          <a class="workflow-tab" href="/download">
            <span class="workflow-step">1</span>
            <span>공시 다운로드</span>
          </a>
          <a class="workflow-tab" href="/table">
            <span class="workflow-step">2</span>
            <span>SQLITE 변환</span>
          </a>
          <a class="workflow-tab active" href="/filter">
            <span class="workflow-step">3</span>
            <span>공시 필터</span>
          </a>
        </nav>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Source</div>
              <div class="panel-title">분류 JSON</div>
            </div>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>입력 경로</span>
              <div class="path-input-row">
                <input id="rootDirectory" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="rootDirectory"
                  data-dialog-mode="folder"
                  data-dialog-title="공시 소스 폴더 선택"
                >
                  📁
                </button>
              </div>
            </label>
            <label class="field">
              <span>저장 경로</span>
              <div class="path-input-row">
                <input id="htmlTransferPath" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="htmlTransferPath"
                  data-dialog-mode="folder"
                  data-dialog-title="저장 경로 선택"
                >
                  📁
                </button>
              </div>
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Filters</div>
              <div class="panel-title">공시 조건</div>
            </div>
          </div>
          <div class="download-grid download-grid-single">
            <div class="field">
              <span>조건검색 프리셋</span>
              <div class="preset-controls">
                <select id="presetSelect" aria-label="조건검색 프리셋 선택"></select>
                <input id="presetName" type="text" placeholder="프리셋 이름" />
                <button id="loadPresetBtn" class="action-button action-button-muted action-button-compact" type="button">
                  불러오기
                </button>
                <button id="savePresetBtn" class="action-button action-button-primary action-button-compact" type="button">
                  저장
                </button>
                <button id="deletePresetBtn" class="action-button action-button-muted action-button-compact" type="button">
                  삭제
                </button>
              </div>
            </div>
            <div class="field">
              <span>조건 블록</span>
              <div id="conditionPreview" class="condition-preview"></div>
              <div id="conditionBlocks" class="condition-blocks"></div>
              <div class="download-actions">
                <button id="addConditionBtn" class="action-button action-button-muted action-button-compact" type="button">
                  조건 추가
                </button>
              </div>
            </div>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>파싱 worker 수</span>
              <input id="filterWorkers" type="number" min="1" max="32" step="1" value="8" />
            </label>
            <label class="field">
              <span>진행 표시 간격</span>
              <input id="progressInterval" type="number" min="1" max="10000" step="1" value="100" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="download-actions">
            <button id="filterBtn" class="action-button action-button-primary action-button-compact" type="button">
              필터 실행
            </button>
            <button id="cancelFilterBtn" class="action-button action-button-muted action-button-compact" type="button" disabled>
              중단
            </button>
          </div>
          <div id="status" class="download-status"></div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Result</div>
              <div class="panel-title">필터 결과</div>
            </div>
          </div>
          <div id="summaryCards" class="summary-cards"></div>
          <div class="result-pager" aria-label="필터 결과 페이지 이동">
            <button id="prevPageBtn" class="action-button action-button-muted action-button-compact" type="button">이전</button>
            <span id="pageInfo" class="page-info">0 / 0</span>
            <button id="nextPageBtn" class="action-button action-button-muted action-button-compact" type="button">다음</button>
          </div>
          <div class="table-wrap disclosure-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>공시일</th>
                  <th>회사</th>
                  <th>시장</th>
                  <th>제목</th>
                  <th>제출인</th>
                  <th>접수번호</th>
                </tr>
              </thead>
              <tbody id="disclosureTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
