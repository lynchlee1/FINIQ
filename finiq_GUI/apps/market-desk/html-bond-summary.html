<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk 사채 발행 요약</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/html-parse.js"></script>
  </head>
  <body data-page="html-bond-summary">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>사채 발행 요약</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link" href="/download">데이터 구축</a>
          <a class="nav-link active" href="/html-download">원문 처리</a>
        </nav>
      </header>

      <main class="download-view">
        <nav class="workflow-tabs panel" aria-label="원문 처리 세부 페이지">
          <a class="workflow-tab" href="/html-download">
            <span class="workflow-step">4</span>
            <span>HTML 저장</span>
          </a>
          <a class="workflow-tab" href="/html-parse">
            <span class="workflow-step">5</span>
            <span>HTML 파싱</span>
          </a>
          <a class="workflow-tab active" href="/html-bond-summary">
            <span class="workflow-step">6</span>
            <span>사채 발행 요약</span>
          </a>
        </nav>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Bond View</div>
              <div class="panel-title">사채 발행 요약</div>
            </div>
            <button id="loadBondSummaryBtn" class="action-button action-button-muted action-button-compact" type="button">
              결과 불러오기
            </button>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>파싱 결과 경로</span>
              <div class="path-input-row">
                <input id="outputPath" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="outputPath"
                  data-dialog-mode="file"
                  data-dialog-title="사채 발행 파싱 결과 JSON 선택"
                >
                  📁
                </button>
              </div>
            </label>
          </div>
          <div class="download-grid download-grid-3">
            <label class="field">
              <span>검색</span>
              <input id="bondSearch" type="search" placeholder="제목, 접수번호, 대상자" />
            </label>
            <label class="field">
              <span>정정 상태</span>
              <select id="bondCorrectionFilter">
                <option value="all">전체</option>
                <option value="corrected">정정 이력 있음</option>
                <option value="current">현재가 정정공시</option>
                <option value="latest">최신 공시</option>
              </select>
            </label>
            <label class="field">
              <span>표시 건수</span>
              <select id="bondLimit">
                <option value="20" selected>20건</option>
                <option value="100">100건</option>
                <option value="300">300건</option>
                <option value="1000">1000건</option>
                <option value="all">전체</option>
              </select>
            </label>
          </div>
          <div class="html-bond-layout">
            <div class="table-wrap html-bond-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>제목</th>
                    <th>회차</th>
                    <th>발행금액(억원)</th>
                    <th>rcept_no</th>
                    <th>공시 원문</th>
                  </tr>
                </thead>
                <tbody id="bondRows">
                  <tr><td colspan="5" class="empty-state">파싱 결과를 불러오면 채권 정보가 표시됩니다.</td></tr>
                </tbody>
              </table>
            </div>
            <section class="html-bond-detail" id="bondDetail">
              <div class="empty-state">행을 선택하면 채권 상세 정보가 표시됩니다.</div>
            </section>
          </div>
          <div id="status" class="download-status"></div>
        </section>
      </main>
    </div>
  </body>
</html>
