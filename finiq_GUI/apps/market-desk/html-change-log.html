<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk 변동기록조회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/html-parse.js"></script>
  </head>
  <body data-page="html-change-log">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>변동기록조회</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link" href="/download">데이터 구축</a>
          <a class="nav-link active" href="/html-download">원문 처리</a>
        </nav>
      </header>

      <main class="download-view">
        <nav class="workflow-tabs panel" aria-label="원문 처리 세부 페이지">
          <a class="workflow-tab" href="/html-download">
            <span class="workflow-step">4</span>
            <span>HTML 저장</span>
          </a>
          <a class="workflow-tab" href="/html-parse">
            <span class="workflow-step">5</span>
            <span>HTML 파싱</span>
          </a>
          <a class="workflow-tab active" href="/html-change-log">
            <span class="workflow-step">6</span>
            <span>변동기록조회</span>
          </a>
          <a class="workflow-tab" href="/html-bond-summary">
            <span class="workflow-step">7</span>
            <span>사채 발행 요약</span>
          </a>
        </nav>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Change Radar</div>
              <div class="panel-title">변동기록조회</div>
            </div>
            <button id="loadChangeLogBtn" class="action-button action-button-primary action-button-compact" type="button">
              변동 불러오기
            </button>
          </div>
          <div class="download-grid download-grid-3">
            <label class="field change-path-field">
              <span>파싱 모드</span>
              <select id="changeMode">
                <option value="bond_issuance">사채발행파싱</option>
                <option value="rights_issuance">유무상증자파싱</option>
              </select>
            </label>
            <label class="field">
              <span>파싱 결과 파일</span>
              <div class="path-input-row">
                <input id="outputPath" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="outputPath"
                  data-dialog-mode="file"
                  data-dialog-title="파싱 결과 파일 선택"
                >
                  📁
                </button>
              </div>
            </label>
            <label class="field">
              <span>검색</span>
              <input id="changeSearch" type="search" placeholder="제목, 접수번호, 필드명" />
            </label>
            <label class="field">
              <span>필터</span>
              <span class="checkbox-card">
                <input id="changeShowOnlyChanges" type="checkbox" />
                변경사항만 보기
              </span>
            </label>
            <label class="field">
              <span>로딩 건수</span>
              <div class="limit-control">
                <input id="changeLimit" type="number" value="50" min="1" step="10" />
                <button id="changeLimitAll" class="limit-unlimited" type="button">
                  <span>전체</span>
                </button>
              </div>
            </label>
          </div>

          <div class="download-grid download-grid-2" style="margin-top: 16px; margin-bottom: 16px; border-top: 1px solid var(--border); padding-top: 16px;">
            <label class="field">
              <span>내보내기 필터</span>
              <span class="checkbox-card">
                <input id="exportLatestOnly" type="checkbox" />
                최신버전만 보기
              </span>
            </label>
            <div class="field" style="justify-content: flex-end;">
              <button id="exportExcelBtn" class="action-button action-button-primary action-button-compact" type="button">
                Export
              </button>
            </div>
          </div>

          <div class="change-radar-layout">
            <section class="change-family-rail" id="changeFamilyRail">
              <div class="empty-state">파싱 결과를 불러오면 정정 패밀리별 변경 필드가 표시됩니다.</div>
            </section>
            <section class="change-detail-stage" id="changeDetailStage">
              <div class="empty-state">패밀리를 선택하면 변경 필드와 이전/이후 값이 표시됩니다.</div>
            </section>
          </div>
          <div id="status" class="download-status"></div>
        </section>
      </main>
    </div>
  </body>
</html>
