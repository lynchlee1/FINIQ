<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk HTML 저장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/html-download.js"></script>
  </head>
  <body data-page="html-download">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>HTML 저장</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link" href="/download">데이터 구축</a>
          <a class="nav-link active" href="/html-download">원문 처리</a>
        </nav>
      </header>

      <main class="download-view">
        <nav class="workflow-tabs panel" aria-label="원문 처리 세부 페이지">
          <a class="workflow-tab active" href="/html-download">
            <span class="workflow-step">4</span>
            <span>HTML 저장</span>
          </a>
          <a class="workflow-tab" href="/html-parse">
            <span class="workflow-step">5</span>
            <span>HTML 파싱</span>
          </a>
          <a class="workflow-tab" href="/html-change-log">
            <span class="workflow-step">6</span>
            <span>변동기록조회</span>
          </a>
          <a class="workflow-tab" href="/html-bond-summary">
            <span class="workflow-step">7</span>
            <span>사채 발행 요약</span>
          </a>
        </nav>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Destination</div>
              <div class="panel-title">HTML 저장</div>
            </div>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>저장 경로</span>
              <div class="path-input-row">
                <input id="outputDirectory" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="outputDirectory"
                  data-dialog-mode="folder"
                  data-dialog-title="HTML 저장 폴더 선택"
                >
                  📁
                </button>
              </div>
            </label>
            <label class="field">
              <span>필터 결과 파일</span>
              <div class="path-input-row">
                <input id="sourceJsonPath" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="sourceJsonPath"
                  data-dialog-mode="file"
                  data-dialog-title="공시 필터 결과 JSON 선택"
                >
                  📁
                </button>
              </div>
            </label>
          </div>
          <div class="download-grid download-grid-4">
            <label class="field">
              <span>타임아웃(초)</span>
              <input id="timeout" type="number" min="1" max="120" step="1" value="20" />
            </label>
            <label class="field">
              <span>최대 요청/분</span>
              <input id="maxRequestsPerMinute" type="number" min="1" max="100" step="1" value="90" />
            </label>
            <label class="field">
              <span>요청 간격(초)</span>
              <input id="waitSeconds" type="number" min="0" max="60" step="0.5" value="0" />
            </label>
            <label class="field">
              <span>최대 처리 건수</span>
              <input id="limit" type="number" min="1" max="10000" step="1" placeholder="비우면 전체" />
            </label>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>기존 파일</span>
              <span class="checkbox-card">
                <input id="skipExisting" type="checkbox" checked />
                이미 저장된 HTML 건너뛰기
              </span>
            </label>
            <label class="field">
              <span>진행 확인 간격(N건)</span>
              <input id="progressInterval" type="number" min="1" max="10000" step="1" value="10" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="download-actions">
            <button id="downloadHtmlBtn" class="action-button action-button-primary action-button-compact" type="button">
              HTML 다운로드 실행
            </button>
            <button id="cancelHtmlBtn" class="action-button action-button-muted action-button-compact" type="button" disabled>
              중지
            </button>
          </div>
          <div id="status" class="download-status"></div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Result</div>
              <div class="panel-title">저장 결과</div>
            </div>
          </div>
          <pre id="result" class="download-result">결과 없음</pre>
        </section>
      </main>
    </div>
  </body>
</html>
