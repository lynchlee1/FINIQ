[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finiq-datascraper"
version = "1.1.0"
description = "FINIQ DataScraper — KRX KIND data collection/parsing/export toolkit"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "data*", "parse*", "storage*", "workflow*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
