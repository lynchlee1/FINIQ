[project]
name = "finiq"
version = "1.1.0"
description = "FINIQ monorepo"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-calamine>=0.7",
    "requests>=2.31",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
