[project]
name = "finiq"
version = "1.1.0"
description = "FINIQ monorepo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "python-calamine>=0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
