<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ DataScraper Dart Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body data-page="home">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ DataScraper</p>
          <h1>Dart Navigator</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link active" href="/">공시 조회</a>
          <a class="nav-link" href="/download">공시 다운로드</a>
        </nav>
      </header>

      <main class="home-view">
        <section class="search-hero">
          <label class="search-input-wrap" for="companySearchInput">
            <span class="sr-only">회사 검색</span>
            <input id="companySearchInput" type="search" placeholder="회사명을 입력하세요." />
          </label>
          <button id="searchCompaniesBtn" class="action-button action-button-primary" type="button">
            <span class="button-icon" aria-hidden="true">⌕</span>
            <span>검색</span>
          </button>
          <button id="toggleSettingsBtn" class="action-button action-button-muted" type="button">
            <span class="button-icon" aria-hidden="true">⚙</span>
            <span>설정</span>
          </button>
        </section>

        <section id="settingsPanel" class="panel settings-panel">
          <div class="settings-grid">
            <section class="source-panel source-panel-price">
              <div class="panel-title">주가 소스</div>
              <label class="field">
                <span>폴더 경로</span>
                <input id="priceDirInput" type="text" placeholder="/path/to/price/folder" />
              </label>
              <label class="field">
                <span>파일 선택</span>
                <select id="priceFileSelect"></select>
              </label>
            </section>

            <section class="source-panel source-panel-disclosure">
              <div class="panel-title">공시 소스</div>
              <label class="field">
                <span>폴더 경로</span>
                <input id="rootDirInput" type="text" />
              </label>
              <label class="field">
                <span>파일 선택</span>
                <select id="classificationSelect"></select>
              </label>
            </section>
          </div>
          <div class="settings-actions">
            <div id="settingsSaveStatus" class="settings-note" hidden></div>
            <button id="saveSettingsBtn" class="action-button action-button-primary action-button-compact" type="button">
              설정 저장
            </button>
          </div>
        </section>

        <section class="panel company-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">회사 목록</div>
              <div class="panel-title">회사 코드</div>
            </div>
            <div id="companyCountBadge" class="count-chip">0</div>
          </div>
          <div id="companyList" class="company-list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
