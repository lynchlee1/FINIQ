<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/market-desk-charts.js"></script>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body data-page="detail">
    <div class="page-shell">
      <section class="panel detail-head">
        <div class="detail-head-copy">
          <p class="detail-kicker">Stock Detail</p>
          <h2 id="heroCompanyName">회사 선택 대기 중</h2>
          <p id="heroMeta">선택한 회사의 공시와 주가를 함께 확인합니다.</p>
        </div>
        <div class="topbar-actions">
          <nav class="topbar-nav" aria-label="주요 메뉴">
            <a class="nav-link active" href="/">공시 조회</a>
            <a class="nav-link" href="/download">공시 다운로드</a>
          <a class="nav-link" href="/table">공시 테이블</a>
            <a class="nav-link" href="/filter">공시 필터</a>
            <a class="nav-link" href="/html-download">HTML 저장</a>
          </nav>
          <button id="backToHomeBtn" class="line-button" type="button">전으로 가기</button>
        </div>
      </section>

      <main class="detail-view">
        <section class="panel detail-filter-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Chart Controls</div>
              <div class="panel-title">차트 조건</div>
            </div>
            <button id="applyFiltersBtn" class="action-button action-button-primary action-button-compact" type="button">
              차트 갱신
            </button>
          </div>
          <div class="detail-filter-grid">
            <div class="field detail-filter-span">
              <span>기간 프리셋</span>
              <div id="rangeChipGroup" class="chip-row"></div>
            </div>
            <label class="field">
              <span>시작일</span>
              <input id="startDateInput" type="date" />
            </label>
            <label class="field">
              <span>종료일</span>
              <input id="endDateInput" type="date" />
            </label>
            <label class="field">
              <span>표시 단위</span>
              <select id="frequencySelect"></select>
            </label>
            <label class="field">
              <span>종목코드</span>
              <input id="stockCodeInput" type="text" maxlength="6" placeholder="000000" />
            </label>
            <label class="field detail-filter-span">
              <span>Parquet 폴더 경로</span>
              <input id="detailPriceDirInput" type="text" placeholder="/path/to/parquet/folder" />
            </label>
          </div>
          <div id="statusBanner" class="status-banner" hidden></div>
        </section>

        <section class="panel chart-panel">
          <div class="chart-topbar">
            <div>
              <div id="chartTitle" class="chart-title">Price / Volume</div>
              <div id="chartSubtitle" class="chart-subtitle">OHLCV</div>
            </div>
            <div id="quoteStrip" class="quote-strip">데이터 대기 중</div>
          </div>
          <div id="chartContainer" class="chart-container"></div>
          <div class="chart-bottombar">
            <div id="groupFilters" class="chip-row"></div>
          </div>
        </section>

        <section class="panel timeline-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Disclosure Flow</div>
              <div class="panel-title">공시 타임라인</div>
            </div>
            <div id="timelineCountBadge" class="count-chip">0</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>공시시각</th>
                  <th>그룹</th>
                  <th>공시제목</th>
                  <th>제출인</th>
                  <th>접수번호</th>
                  <th>기준 봉</th>
                </tr>
              </thead>
              <tbody id="timelineBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
