<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk Disclosure Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/table.js"></script>
  </head>
  <body data-page="table">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>Disclosure Table</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link" href="/download">공시 다운로드</a>
          <a class="nav-link active" href="/table">공시 테이블</a>
          <a class="nav-link" href="/filter">공시 필터</a>
          <a class="nav-link" href="/html-download">HTML 저장</a>
        </nav>
      </header>

      <main class="download-view">
        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Source</div>
              <div class="panel-title">Raw JSON 또는 원본 폴더 선택</div>
            </div>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>공시 소스 폴더</span>
              <input id="rootDirectory" type="text" />
            </label>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>Raw JSON 또는 원본 폴더 경로</span>
              <input id="classificationPath" type="text" list="classificationPathOptions" />
              <datalist id="classificationPathOptions"></datalist>
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Destination</div>
              <div class="panel-title">연도별 SQLite shard 생성</div>
            </div>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>Manifest 저장 경로</span>
              <input id="outputPath" type="text" />
            </label>
            <label class="field">
              <span>테이블명</span>
              <input id="tableName" type="text" value="disclosures" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="download-actions">
            <button id="refreshBtn" class="action-button action-button-muted action-button-compact" type="button">
              소스 새로고침
            </button>
            <button id="buildBtn" class="action-button action-button-primary action-button-compact" type="button">
              테이블 생성
            </button>
          </div>
          <div id="status" class="download-status"></div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Result</div>
              <div class="panel-title">변환 결과</div>
            </div>
          </div>
          <div id="summaryCards" class="summary-cards"></div>
          <pre id="result" class="download-result">결과 없음</pre>
        </section>
      </main>
    </div>
  </body>
</html>
