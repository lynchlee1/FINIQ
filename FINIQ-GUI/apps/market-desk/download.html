<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINIQ MarketDesk Download Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/download.js"></script>
  </head>
  <body data-page="download">
    <div class="page-shell">
      <header class="topbar panel">
        <div class="topbar-copy">
          <p class="brand-label">FINIQ MarketDesk</p>
          <h1>Download Desk</h1>
        </div>
        <nav class="topbar-nav" aria-label="주요 메뉴">
          <a class="nav-link" href="/">공시 조회</a>
          <a class="nav-link active" href="/download">공시 다운로드</a>
          <a class="nav-link" href="/table">SQLITE 변환</a>
          <a class="nav-link" href="/filter">공시 필터</a>
          <a class="nav-link" href="/html-download">HTML 저장</a>
        </nav>
      </header>

      <main class="download-view">
        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Run Scope</div>
              <div class="panel-title">저장 위치와 기간</div>
            </div>
          </div>
          <div class="download-grid download-grid-single">
            <label class="field">
              <span>저장 경로</span>
              <div class="path-input-row">
                <input id="outputDirectory" type="text" />
                <button
                  class="action-button action-button-muted action-button-compact"
                  type="button"
                  data-path-target="outputDirectory"
                  data-dialog-mode="folder"
                  data-dialog-title="저장 폴더 선택"
                >
                  📁
                </button>
              </div>
            </label>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>시작일</span>
              <input id="startDate" type="date" />
            </label>
            <label class="field">
              <span>종료일</span>
              <input id="endDate" type="date" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Search Filters</div>
              <div class="panel-title">검색 조건</div>
            </div>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>회사명</span>
              <input id="companyName" type="text" placeholder="예: 삼성전자" />
            </label>
            <label class="field">
              <span>제출인명</span>
              <input id="submitterName" type="text" />
            </label>
          </div>
          <div class="download-grid download-grid-2">
            <label class="field">
              <span>시장구분</span>
              <select id="marketLabel"></select>
            </label>
            <label class="field">
              <span>유가증권구분</span>
              <select id="securitiesLabel"></select>
            </label>
          </div>
          <div class="download-grid download-grid-4">
            <label class="field">
              <span>페이지 크기</span>
              <input id="pageSize" type="number" min="1" max="100" value="100" />
            </label>
            <label class="field">
              <span>요청 간격(초)</span>
              <input id="waitSeconds" type="number" min="0" max="30" step="0.5" value="1.0" />
            </label>
            <label class="field">
              <span>타임아웃(초)</span>
              <input id="timeout" type="number" min="1" max="120" step="1" value="20" />
            </label>
            <label class="field">
              <span>병렬 작업 수</span>
              <input id="workerCount" type="number" min="1" max="32" step="1" value="4" />
            </label>
          </div>
          <div class="download-grid download-grid-4">
            <label class="field">
              <span>시작 페이지</span>
              <input id="startPage" type="number" min="1" value="1" />
            </label>
            <label class="field">
              <span>끝 페이지</span>
              <input id="endPage" type="number" min="1" placeholder="비우면 자동 전체" />
            </label>
            <label class="field">
              <span>보고서 옵션</span>
              <span class="checkbox-card">
                <input id="lastReportOnly" type="checkbox" />
                최종보고서만 조회
              </span>
            </label>
            <label class="field">
              <span>연도별 이어받기</span>
              <span class="checkbox-card">
                <input id="resumeYearly" type="checkbox" checked />
                기존 연도 폴더 이어받기
              </span>
            </label>
          </div>
          <div class="download-grid download-grid-4">
            <label class="field">
              <span>표시 로그 수</span>
              <input id="logLimit" type="number" min="1" max="500" step="1" value="20" />
            </label>
          </div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Disclosure Types</div>
              <div class="panel-title">공시유형</div>
            </div>
          </div>
          <div id="disclosureGroups" class="disclosure-groups"></div>
        </section>

        <section class="panel download-panel">
          <div class="download-actions">
            <button id="previewBtn" class="action-button action-button-muted action-button-compact" type="button">
              페이로드 미리보기
            </button>
            <button id="runBtn" class="action-button action-button-primary action-button-compact" type="button">
              다운로드 실행
            </button>
          </div>
          <div id="status" class="download-status"></div>
        </section>

        <section class="panel download-panel">
          <div class="panel-header">
            <div>
              <div class="panel-kicker">Result</div>
              <div class="panel-title">응답 페이로드</div>
            </div>
          </div>
          <pre id="result" class="download-result">결과 없음</pre>
        </section>
      </main>
    </div>
  </body>
</html>
