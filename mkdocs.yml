site_name: FINIQ 문서
site_description: FINIQ 공시 수집·분석·시각화 프로젝트 문서
repo_url: https://github.com/lynchlee1/FINIQ
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 문서 홈: index.md
  - 아키텍처: architecture.md
  - 공시 파이프라인:
      - 전체 흐름: disclosures/index.md
      - 공통 계약:
          - 개요: disclosures/common/index.md
          - 작업공간: disclosures/common/workspace.md
          - 식별자: disclosures/common/identifiers.md
          - 실행과 HTML 재사용: disclosures/common/execution.md
          - 예외와 복구: disclosures/common/recovery.md
          - 화면과 서비스: disclosures/common/interface.md
      - 01 공시내역 다운로드:
          - 단계 개요: disclosures/01-download/index.md
          - 다운로드 실행: disclosures/01-download/download.md
          - 기존 데이터 검사: disclosures/01-download/inspection.md
          - 저장 형식: disclosures/01-download/storage.md
      - 02 공시내역 변환:
          - 단계 개요: disclosures/02-table/index.md
          - 변환과 SQLite 생성: disclosures/02-table/conversion.md
          - 결과 무결성 검사: disclosures/02-table/inspection.md
          - 저장 형식: disclosures/02-table/storage.md
      - 03 공시내역 필터링:
          - 단계 개요: disclosures/03-filter/index.md
          - 필터 구성: disclosures/03-filter/filtering.md
          - 실행과 결과 관리: disclosures/03-filter/execution.md
          - 저장 형식: disclosures/03-filter/storage.md
      - 04 공시원문 외부 저장:
          - 단계 개요: disclosures/04-external-html/index.md
          - 외부 HTML 저장: disclosures/04-external-html/download.md
          - 기존 데이터 검사: disclosures/04-external-html/inspection.md
          - 압축: disclosures/04-external-html/compression.md
          - 저장 형식: disclosures/04-external-html/storage.md
      - 05 공시원문 내부 저장:
          - 단계 개요: disclosures/05-internal-html/index.md
          - 내부 HTML 저장: disclosures/05-internal-html/download.md
          - 저장 형식: disclosures/05-internal-html/storage.md
          - 네트워크 경로: disclosures/05-internal-html/proxy.md
      - 06 공시원문 목차 분리:
          - 단계 개요: disclosures/06-section-split/index.md
          - 분리 경계: disclosures/06-section-split/boundaries.md
          - 처리 흐름: disclosures/06-section-split/workflow.md
          - 저장 형식: disclosures/06-section-split/storage.md
      - 07 공시원문 변환:
          - 단계 개요: disclosures/07-html-parse/index.md
          - 변환 실행: disclosures/07-html-parse/workflow.md
          - 요청과 행 변환: disclosures/07-html-parse/request.md
          - 저장 형식: disclosures/07-html-parse/storage.md
          - 진단과 조회: disclosures/07-html-parse/diagnostics.md
          - 자산 거래: disclosures/07-html-parse/parsers/asset-transaction.md
          - 채권 발행: disclosures/07-html-parse/parsers/bond-issuance.md
          - 유상·무상증자: disclosures/07-html-parse/parsers/rights-issuance.md
          - 증권 거래: disclosures/07-html-parse/parsers/security-transaction.md
          - 주주총회: disclosures/07-html-parse/parsers/shareholder-meeting.md
      - 08 공시 정정내역 한눈에:
          - 단계 개요: disclosures/08-change-log/index.md
          - 정정내역 비교: disclosures/08-change-log/comparison.md
          - 결과 조회: disclosures/08-change-log/review.md
          - 저장 형식: disclosures/08-change-log/storage.md
      - 09 공시 관계 그래프:
          - 단계 개요: disclosures/09-disclosure-graph/index.md
          - 그래프 구성: disclosures/09-disclosure-graph/graph.md
          - 주주총회 관계: disclosures/09-disclosure-graph/shareholder-meeting.md
          - 저장 형식: disclosures/09-disclosure-graph/storage.md
  - Ontology:
      - 개요: ontology/index.md
      - 공통 계약:
          - 개요: ontology/common/index.md
          - 복구: ontology/common/recovery.md
          - 검증과 중단: ontology/common/validation.md
          - 실행 환경: ontology/common/runtime.md
      - Quantiwise:
          - 개요: ontology/quantiwise/index.md
          - 복구: ontology/quantiwise/recovery.md
          - 검증과 중단: ontology/quantiwise/validation.md
          - 변환과 병합: ontology/quantiwise/runtime.md
      - Graph View:
          - 개요: ontology/graph-view/index.md
          - 복구: ontology/graph-view/recovery.md
          - 검증과 중단: ontology/graph-view/validation.md
          - 그래프 동작: ontology/graph-view/behavior.md
      - Chart View:
          - 개요: ontology/chart-view/index.md
          - 복구: ontology/chart-view/recovery.md
          - 검증과 중단: ontology/chart-view/validation.md
          - 차트 동작: ontology/chart-view/behavior.md
      - 공시 분석:
          - 개요: ontology/disclosure-analysis/index.md
          - 복구: ontology/disclosure-analysis/recovery.md
          - 검증과 중단: ontology/disclosure-analysis/validation.md
          - 분석과 저장: ontology/disclosure-analysis/behavior.md
  - 디자인:
      - 디자인 시스템: design/index.md
      - 시각 기반: design/foundations.md
      - UI 용어:
          - 원칙과 문서 안내: design/terminology/index.md
          - 공통과 작업공간: design/terminology/common.md
          - 공시 워크플로우: design/terminology/disclosures.md
          - 유틸리티와 주가 데이터: design/terminology/utility.md
          - Ontology: design/terminology/ontology.md
          - 우측 도크: design/terminology/right-dock.md
      - 컴포넌트:
          - 공통 계약: design/components/index.md
          - 기존 데이터 검토: design/components/inspection-block.md
  - 운영 안내: operations.md
  - 개발 안내: development.md
  - ADR:
      - 원자적 게시: adr/0001-atomic-publication.md
