[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consigliereai"
version = "0.4.0"
description = "ConsigliereAI visualization workspace (uses FINIQ-DataScraper outputs)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2",
]

[project.scripts]
kind-web = "web.app:main"

[project.optional-dependencies]
web = [
    "finance-datareader>=0.9.100",
    "pyarrow>=14",
]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["analytics*", "data*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
