[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finiq-structurenl"
version = "0.1.0"
description = "FINIQ StructureNL disclosure parsing helpers"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["disclosure"]

[tool.pytest.ini_options]
pythonpath = ["src"]
